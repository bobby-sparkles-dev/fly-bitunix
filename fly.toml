# fly.toml app configuration file generated for fly-bitunix on 2026-05-02T10:06:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fly-bitunix'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  MAX_SKEW_MS = '30000'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '5s'
    method = 'GET'
    path = '/_health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
