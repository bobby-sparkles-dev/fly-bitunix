# Fly.io configuration for the BitUnix geo-unblock proxy.
# Rename `app` to whatever you used with `fly launch`.
app = "bitunix-proxy"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  MAX_SKEW_MS = "30000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # keep warm; cold starts add latency to every BitUnix call
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/_health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
