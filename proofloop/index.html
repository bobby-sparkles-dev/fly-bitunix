<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proofloop · Opportunity Intelligence</title>
<style>
:root{--bg:#f5f5f1;--panel:#fff;--ink:#1d302b;--muted:#7b8984;--border:#e5e9e4;--green:#237d60;--greenp:#e6f3ec;--amber:#9a6a1d;--amberp:#fff3da;--nav:#172b27}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Arial,sans-serif;color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:var(--green)}.hidden{display:none!important}
.shell{display:flex;min-height:100vh}.sidebar{width:255px;flex-shrink:0;background:var(--nav);color:#e3eee7;padding:30px 20px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:13px;font-size:23px;font-weight:750;letter-spacing:-1.2px;padding:0 10px 30px}
.mark{height:34px;width:34px;background:#97dcab;border-radius:12px;display:grid;place-items:center;color:#173e2b;font-size:20px}
.eyebrow{color:#789789;font-size:11px;letter-spacing:1.7px;text-transform:uppercase;font-weight:800;margin:12px 11px}
nav{display:grid;gap:5px}.navbtn{background:transparent;color:#b2c5bc;border:0;text-align:left;border-radius:10px;padding:12px 14px;font-weight:570;width:100%}.navbtn.active,.navbtn:hover{background:#2e4940;color:white}
.navbtn span{display:inline-block;width:26px;opacity:.9}.sidefoot{position:absolute;bottom:30px;left:30px;right:30px;color:#93aaa0;font-size:12px;line-height:1.5}
.main{flex:1;min-width:0;padding:40px max(30px,calc((100vw - 1330px)/2));max-width:calc(100vw - 255px)}
.top{display:flex;gap:20px;align-items:center;justify-content:space-between;margin-bottom:28px}.overline{font-size:12px;letter-spacing:1.7px;text-transform:uppercase;font-weight:750;color:var(--green)}h1{font-size:36px;letter-spacing:-1.7px;margin:7px 0 7px;line-height:1.15}h2{font-size:20px;letter-spacing:-.6px;margin:0}h3{font-size:16px;margin:0}.sub{color:#6f7f78;margin:0;line-height:1.5;max-width:750px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border-radius:10px;border:1px solid #d7dfd9;background:white;padding:10px 15px;font-size:13px;font-weight:680;color:var(--ink);box-shadow:0 1px 1px #00000005}.btn:hover{border-color:#92ae9e}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn:disabled{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:25px}.kpi{background:#fff;padding:22px;border:1px solid var(--border);border-radius:16px}.kpi label{display:block;color:#788b81;font-size:12px;margin-bottom:10px;font-weight:600}.kpi strong{font-size:31px;letter-spacing:-1.6px}.kpi small{color:#97a59d;font-size:12px;margin-left:7px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr);gap:18px}.panel{background:white;border:1px solid var(--border);border-radius:17px;overflow:hidden;margin-bottom:18px}.panelhead{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--border)}.panelbody{padding:20px 24px}.idea{display:flex;gap:16px;padding:19px 24px;align-items:start;border-bottom:1px solid var(--border)}.idea:last-child{border:0}.idea:hover{background:#fbfcfa}.number{font-size:12px;font-weight:760;color:#b0bfb5;margin-top:4px;width:24px;flex-shrink:0}.grow{flex:1;min-width:0}.tiny{font-size:12px;color:#89978c}.meta{display:flex;gap:12px;color:#849187;font-size:12px;flex-wrap:wrap;margin-top:9px}.pill{font-size:11px;white-space:nowrap;font-weight:760;padding:6px 9px;border-radius:20px;background:#eef0ed;color:#67786d}.pill.green{color:#1d7852;background:var(--greenp)}.pill.amber{color:var(--amber);background:var(--amberp)}
.line{height:1px;background:var(--border);margin:16px 0}.empty{text-align:center;color:#8a9c92;padding:30px 20px;font-size:14px;line-height:1.5}.note{background:#f0f7f1;border:1px solid #d9eadd;padding:17px;border-radius:12px;color:#32644b;font-size:13px;line-height:1.6}.research{padding:15px 0;border-bottom:1px solid var(--border)}.research:last-child{border:0}.research a{font-size:14px;text-decoration:none;font-weight:700}.research p{font-size:12px;color:#7a8b81;margin:6px 0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{background:#fbfcfa;color:#7b8b81;text-align:left;text-transform:uppercase;font-size:10px;letter-spacing:1px}th,td{border-bottom:1px solid var(--border);padding:14px 17px}td{vertical-align:top}td:first-child{font-weight:650}tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{border:0;background:transparent;color:#74867c;font-weight:680;padding:9px 12px;border-bottom:2px solid transparent}.tab.active{border-bottom-color:var(--green);color:var(--green)}
input,select,textarea{border:1px solid #dce3dc;border-radius:9px;padding:10px 12px;width:100%;background:#fff;color:var(--ink)}textarea{min-height:90px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid #b6dcc5}label.formlabel{display:block;margin:11px 0 6px;font-weight:670;font-size:12px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.loginback{min-height:100vh;background:#18362d;display:grid;place-items:center;padding:20px}.login{width:min(420px,100%);padding:35px;background:white;border-radius:18px;box-shadow:0 24px 70px #0002}.login h1{font-size:31px}.login .mark{margin-bottom:20px}.login button{width:100%;margin-top:15px}.error{color:#b44343;font-size:12px;min-height:20px;padding-top:9px}
dialog{border:1px solid var(--border);border-radius:18px;padding:0;width:min(580px,calc(100vw - 24px));box-shadow:0 25px 80px #0003}dialog::backdrop{background:#122c2388}.modalhead{padding:21px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.modalbody{padding:12px 24px 24px;max-height:75vh;overflow:auto}.x{border:0;background:none;font-size:24px;color:#789185}.formfoot{display:flex;justify-content:flex-end;margin-top:16px;gap:8px}
.toast{position:fixed;right:20px;bottom:20px;background:#193f32;color:white;padding:14px 18px;border-radius:12px;box-shadow:0 12px 25px #0002;z-index:20;display:none;max-width:420px}
.code{font-family:ui-monospace,monospace;font-size:12px;color:#7c8b84}.result{border-top:1px solid var(--border);padding:16px 0}.result:first-child{border-top:0}.result a{font-weight:670;text-decoration:none}.result p{font-size:13px;color:#7e8d84}
@media(max-width:1040px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.main{padding:24px;}}
@media(max-width:700px){.shell{display:block}.sidebar{height:auto;width:100%;position:static;padding:14px}.brand{padding:0 0 10px;font-size:18px}.brand .mark{width:28px;height:28px}.eyebrow,.sidefoot{display:none}nav{display:flex;overflow-x:auto;gap:3px}.navbtn{white-space:nowrap;width:auto;font-size:12px;padding:9px 10px}.navbtn span{width:18px}.main{max-width:100%;padding:21px 14px}.top{align-items:start;flex-direction:column}h1{font-size:30px}.kpis{gap:8px}.kpi{padding:17px}.formrow{grid-template-columns:1fr}.idea{padding:16px}.panelhead{padding:18px}.panelbody{padding:16px}}
</style>
</head>
<body>
<div id="loginScreen" class="loginback hidden"><form class="login" id="loginForm"><div class="mark">◈</div><div class="overline">PRIVATE WORKSPACE</div><h1>Welcome to Proofloop</h1><p class="sub">Opportunity intelligence. Real evidence, before building.</p><label class="formlabel">Dashboard password</label><input name="password" type="password" required autocomplete="current-password"><button class="btn primary" type="submit">Open workspace</button><div id="loginError" class="error"></div></form></div>
<div id="workspace" class="shell hidden">
<aside class="sidebar"><div class="brand"><div class="mark">◈</div>Proofloop</div><div class="eyebrow">Workspace</div><nav id="nav">
<button class="navbtn active" data-view="portfolio"><span>◫</span> Portfolio</button>
<button class="navbtn" data-view="discovery"><span>◇</span> Discovery</button>
<button class="navbtn" data-view="experiments"><span>⚗</span> Experiments</button>
<button class="navbtn" data-view="leads"><span>♧</span> Prospects</button>
<button class="navbtn" data-view="conversations"><span>☷</span> Conversations</button>
<button class="navbtn" data-view="settings"><span>⚙</span> Controls</button>
</nav><div class="sidefoot">OBSERVE → VALIDATE → BUILD<br><br><span style="color:#90dab3">●</span> Outbound messaging OFF</div></aside>
<main class="main"><div class="top"><div><div id="topEyebrow" class="overline">OPPORTUNITY INTELLIGENCE</div><h1 id="viewTitle">Idea portfolio</h1><p id="viewSub" class="sub">Your hypotheses, evidence and signals of real customer demand.</p></div><div class="actions" id="topActions"><button class="btn primary" id="newIdea">+ Add idea</button></div></div><div id="content"></div></main>
</div>
<dialog id="modal"><div class="modalhead"><h2 id="modalTitle">New</h2><button class="x" onclick="document.getElementById('modal').close()" aria-label="Close">×</button></div><form class="modalbody" id="modalForm"><div id="modalFields"></div><div class="formfoot"><button type="button" class="btn" onclick="document.getElementById('modal').close()">Cancel</button><button type="submit" class="btn primary" id="modalSubmit">Save</button></div></form></dialog>
<div id="toast" class="toast"></div>
<script>
var state={ideas:[],leads:[],evidence:[],experiments:[],research:[],conversations:[],events:[],settings:{}}, view='portfolio';
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function toast(t){var x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(function(){x.style.display='none'},4500)}
async function api(url,method,data){var r=await fetch(url,{method:method||'GET',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});var j=await r.json().catch(function(){return{detail:'Unexpected response'}});if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:'Request failed');return j}
function date(v){return v?new Date(v).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):''}
function tag(t){var cls=t==='build'||t==='commercial'||t==='interested'?'green':t==='research'||t==='hypothesis'||t==='draft'?'amber':'';return '<span class="pill '+cls+'">'+esc(t||'new')+'</span>'}
function opts(rows,empty){return (empty?'<option value="">'+esc(empty)+'</option>':'')+rows.map(function(x){return '<option value="'+x.id+'">'+esc(x.title||x.company)+'</option>'}).join('')}
function head(title,sub){var titles={portfolio:'Idea portfolio',discovery:'Research & discovery',experiments:'Live experiments',leads:'Prospect pipeline',conversations:'Conversations',settings:'System controls'};var subs={portfolio:'Your hypotheses, evidence and signals of real customer demand.',discovery:'Find unmet needs, examine external sources and propose new opportunities.',experiments:'Start with small waves. Preserve your audience. Learn before scaling.',leads:'People and businesses worth understanding, not a bulk mailing list.',conversations:'A durable record of what prospective customers actually say.',settings:'Clear boundaries, audit history and safe operating defaults.'};document.getElementById('viewTitle').textContent=titles[view];document.getElementById('viewSub').textContent=subs[view];document.getElementById('topActions').innerHTML=view==='portfolio'?'<button class="btn primary" onclick="openForm(\'idea\')">+ Add idea</button>':view==='experiments'?'<button class="btn primary" onclick="openForm(\'experiment\')">+ New experiment</button>':view==='leads'?'<button class="btn primary" onclick="openForm(\'lead\')">+ Add prospect</button>':view==='conversations'?'<button class="btn" onclick="openForm(\'conversation\')">+ Record conversation</button>':view==='discovery'?'<button class="btn primary" onclick="runResearch(\'discovery\')">↻ Explore problems</button>':''}
function counts(){return '<div class="kpis"><div class="kpi"><label>Ideas under consideration</label><strong>'+state.ideas.length+'</strong><small>hypotheses</small></div><div class="kpi"><label>Evidence records</label><strong>'+state.evidence.length+'</strong><small>sources</small></div><div class="kpi"><label>Prospective customers</label><strong>'+state.leads.length+'</strong><small>not contacted</small></div><div class="kpi"><label>Commercial signals</label><strong>'+state.ideas.filter(function(i){return i.stage==='commercial'||i.stage==='build'}).length+'</strong><small>ideas</small></div></div>'}
function ideasList(){if(!state.ideas.length)return '<div class="empty">No ideas yet.</div>';return state.ideas.map(function(i,n){return '<div class="idea"><div class="number">'+String(n+1).padStart(2,'0')+'</div><div class="grow"><h3>'+esc(i.title)+'</h3><p class="sub" style="font-size:13px;margin-top:5px">'+esc(i.description)+'</p><div class="meta"><span>'+esc(i.audience||'Audience unknown')+'</span><span>'+i.evidence_count+' evidence</span><span>'+i.lead_count+' prospects</span><span>Origin: '+esc(i.origin)+'</span></div><div class="actions" style="margin-top:12px"><a class="btn" style="text-decoration:none" href="/missions/'+i.id+'">Open mission →</a> <button class="btn" onclick="runResearch(\'targeted\','+i.id+')">Research</button><button class="btn" onclick="openForm(\'evidence\','+i.id+')">+ Evidence</button><button class="btn" onclick="setDecision('+i.id+',\'park\')">Park</button><button class="btn" onclick="setDecision('+i.id+',\'test\')">Test</button></div></div><div>'+tag(i.decision)+'</div></div>'}).join('')}
function portfolio(){var rs=state.research.slice(0,4).map(function(r){return '<div class="research"><b>'+esc(r.query)+'</b><p>'+r.result_count+' public matches · '+date(r.created_at)+'</p></div>'}).join('');return counts()+'<div class="grid"><div class="panel"><div class="panelhead"><h2>Opportunity pipeline</h2><span class="tiny">'+state.ideas.length+' ideas</span></div>'+ideasList()+'</div><div><div class="panel"><div class="panelhead"><h2>Latest research</h2></div><div class="panelbody">'+(rs||'<div class="empty">No research runs yet. Start with a narrow question.</div>')+'<button class="btn" onclick="go(\'discovery\')">Explore discovery →</button></div></div><div class="panel"><div class="panelhead"><h2>Commercial discipline</h2></div><div class="panelbody"><div class="note"><b>No evidence, no major build.</b><br>Projects advance on customer pain, real conversations and genuine willingness to pay. Outreach is disabled until eligibility, consent and sending controls are configured.</div></div></div></div></div>'}
function discovery(){var all=state.research.slice(0,10).map(function(r){var links=(r.findings||[]).slice(0,5).map(function(f){return '<div class="result"><a href="'+esc(f.url)+'" target="_blank" rel="noopener noreferrer">'+esc(f.title)+'</a><p>'+esc(f.excerpt||'Public source result')+'</p></div>'}).join('');return '<div class="panel"><div class="panelhead"><h3>'+esc(r.query)+'</h3><span class="tiny">'+r.result_count+' matches · '+date(r.created_at)+'</span></div><div class="panelbody">'+(links||'<div class="empty">No matches. Try a broader query.</div>')+'</div></div>'}).join('');return '<div class="panel"><div class="panelhead"><h2>Investigate a problem</h2><span class="pill amber">Source research, not buyer validation</span></div><div class="panelbody"><div class="formrow"><div><label class="formlabel">Search for real operational friction</label><input id="query" placeholder="e.g. manual wholesale inventory reconciliation"></div><div><label class="formlabel">Related idea (optional)</label><select id="researchIdea">'+opts(state.ideas,'Open discovery')+'</select></div></div><div class="actions" style="margin-top:13px"><button class="btn primary" onclick="runResearch(\'targeted\')">Run research</button><button class="btn" onclick="runResearch(\'discovery\')">Open-ended search</button></div><p class="tiny">Initial source: public Hacker News search. Every finding links to its source. Discovery expands to more approved sources in later releases.</p></div></div><h2 style="margin:25px 0 14px">Research history</h2>'+(all||'<div class="panel"><div class="empty">No research yet. Run a search to start collecting evidence.</div></div>')}
function experiments(){var rows=state.experiments.map(function(x){return '<tr><td>'+esc(x.title)+'<div class="tiny">'+esc(x.idea_title)+'</div></td><td>'+esc(x.channel)+'</td><td>'+tag(x.status)+'</td><td>'+x.contacted+'/'+x.wave_size+'</td><td>'+x.replied+'</td><td>'+date(x.created_at)+'</td></tr>'}).join('');return '<div class="note" style="margin-bottom:20px"><b>Progressive by design.</b> Initial wave: 6 carefully selected contacts, two variants. Only advance with evidence. This first version drafts experiments but does not send messages.</div><div class="panel"><div class="panelhead"><h2>Outreach experiments</h2><span class="tiny">Outbound disabled</span></div><div class="tablewrap"><table><thead><tr><th>Experiment</th><th>Channel</th><th>Status</th><th>Wave</th><th>Replies</th><th>Created</th></tr></thead><tbody>'+(rows||'<tr><td colspan="6"><div class="empty">No experiments yet.</div></td></tr>')+'</tbody></table></div></div>'}
function leads(){var rows=state.leads.map(function(l){return '<tr><td>'+esc(l.company)+'<div class="tiny">'+esc(l.name)+'</div></td><td>'+esc(l.idea_title||'—')+'</td><td>'+esc(l.email||l.website||'—')+'</td><td>'+tag(l.stage)+'</td><td>'+esc(l.eligibility)+'</td></tr>'}).join('');return '<div class="panel"><div class="panelhead"><h2>Prospective customers</h2><span class="tiny">No outbound sent</span></div><div class="tablewrap"><table><thead><tr><th>Organisation</th><th>Idea</th><th>Contact</th><th>Stage</th><th>Eligibility</th></tr></thead><tbody>'+(rows||'<tr><td colspan="5"><div class="empty">No verified prospects added yet.</div></td></tr>')+'</tbody></table></div></div>'}
function conversations(){var rows=state.conversations.map(function(c){return '<div class="idea"><div class="grow"><div class="actions">'+tag(c.intent)+'<span class="tiny">'+esc(c.company||'Unlinked')+' · '+esc(c.channel)+' · '+esc(c.direction)+' · '+date(c.created_at)+'</span></div><p style="font-size:13px;line-height:1.6">'+esc(c.body)+'</p></div></div>'}).join('');return '<div class="panel"><div class="panelhead"><h2>Conversation log</h2></div>'+(rows||'<div class="empty">No conversations recorded. Real messages will appear here once an integration is configured.</div>')+'</div>'}
function settings(){var rows=state.events.map(function(e){return '<tr><td>'+date(e.created_at)+'</td><td>'+esc(e.event)+'</td><td>'+esc(e.detail)+'</td></tr>'}).join('');return '<div class="panel"><div class="panelhead"><h2>Operating limits</h2></div><div class="panelbody"><div class="note"><b>Outbound messaging is permanently OFF in this MVP.</b><br>No emails, DMs or forum posts can be sent by this version. Linking a sending provider, audit checks and contact eligibility rules come next.</div><p style="font-size:13px;line-height:2">Maximum new contacts/week: <b>'+esc(state.settings.max_new_contacts_week||'20')+'</b><br>Maximum simultaneous outreach ideas: <b>'+esc(state.settings.max_active_ideas||'2')+'</b><br>Research mode: <b>'+esc(state.settings.research_mode||'manual')+'</b><br>Storage: <b>Neon PostgreSQL</b><br>Authentication: <b>Private signed session</b></p><button class="btn" onclick="logout()">Sign out</button></div></div><div class="panel"><div class="panelhead"><h2>Audit trail</h2></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Event</th><th>Details</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'}
function render(){head();var html={portfolio:portfolio,discovery:discovery,experiments:experiments,leads:leads,conversations:conversations,settings:settings}[view]();document.getElementById('content').innerHTML=html;document.querySelectorAll('.navbtn').forEach(function(b){b.classList.toggle('active',b.dataset.view===view)})}
function go(v){view=v;render()}
async function load(){state=await api('/api/dashboard');render()}
async function setDecision(id,decision){try{await api('/api/ideas/'+id,'PATCH',{decision:decision});toast('Idea moved to '+decision);await load()}catch(e){toast(e.message)}}
async function runResearch(mode,id){var q=document.getElementById('query'),sel=document.getElementById('researchIdea');var payload={mode:mode,idea_id:id||((sel&&sel.value)?Number(sel.value):null),query:q?q.value:''};toast('Researching public sources…');try{var r=await api('/api/research/run','POST',payload);toast('Collected '+r.count+' linked source results.');view='discovery';await load()}catch(e){toast(e.message)}}
function field(label,name,type,extra){return '<label class="formlabel">'+label+'</label>'+(type==='textarea'?'<textarea name="'+name+'" '+(extra||'')+'></textarea>':'<input name="'+name+'" type="'+(type||'text')+'" '+(extra||'')+'>')}
function selectField(label,name,options){return '<label class="formlabel">'+label+'</label><select name="'+name+'">'+options+'</select>'}
var formType='idea';
function openForm(type,ideaId){formType=type;var f='';var title={idea:'New idea',experiment:'New experiment',lead:'New prospect',evidence:'Add evidence',conversation:'Record a conversation'}[type];
if(type==='idea')f=field('Idea name','title','text','required maxlength="160"')+field('Who has this problem?','audience','text')+field('What would the solution do?','description','textarea');
if(type==='experiment')f=selectField('Related idea','idea_id',opts(state.ideas))+field('Experiment title','title','text','required')+field('Hypothesis to test','hypothesis','textarea')+selectField('Channel','channel','<option value="email">Email</option><option value="forum">Forum discussion</option><option value="partner">Partner referral</option>')+field('Message A','variant_a','textarea')+field('Message B','variant_b','textarea')+field('First wave size (1–20)','wave_size','number','min="1" max="20" value="6"');
if(type==='lead')f=selectField('Related idea','idea_id',opts(state.ideas,'Not linked'))+field('Business name','company','text','required')+field('Contact name','name','text')+field('Email','email','email')+field('Website','website','url')+selectField('Contact eligibility','eligibility','<option value="unverified">Not verified</option><option value="permission">Permission obtained</option><option value="corporate_reviewed">Corporate contact reviewed</option><option value="suppressed">Do not contact</option>')+field('Source / notes','notes','textarea');
if(type==='evidence')f=selectField('Idea','idea_id',opts(state.ideas))+field('What did the source actually say?','excerpt','textarea','required')+field('Source name','source_name','text')+field('Source URL','source_url','url')+selectField('Evidence strength','strength','<option value="weak">Early clue</option><option value="medium">Direct problem confirmation</option><option value="strong">Commercial commitment</option>');
if(type==='conversation')f=selectField('Idea','idea_id',opts(state.ideas,'Not linked'))+selectField('Prospect','lead_id',opts(state.leads,'Not linked'))+selectField('Direction','direction','<option value="inbound">Incoming</option><option value="outbound">Outgoing</option>')+selectField('Intent','intent','<option value="unclassified">Unclassified</option><option value="problem">Problem confirmed</option><option value="interested">Interested</option><option value="objection">Objection</option><option value="pilot">Pilot interest</option>')+field('Message','body','textarea','required');
document.getElementById('modalTitle').textContent=title;document.getElementById('modalFields').innerHTML=f;var s=document.getElementById('modalForm').elements.namedItem('idea_id');if(s&&ideaId)s.value=ideaId;document.getElementById('modal').showModal()}
