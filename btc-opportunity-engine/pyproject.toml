[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-opportunity-engine"
version = "0.1.0"
description = "Research-only adaptive BTC long opportunity filter, with public-market context and external signal registry"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.4,<2", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
btc-edge = "btc_edge.cli:main"

[tool.setuptools.packages.find]
include = ["btc_edge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
